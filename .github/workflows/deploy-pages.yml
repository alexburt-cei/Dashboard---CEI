name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/react-excel-dashboard-ie7et4
  workflow_dispatch:

# GITHUB_TOKEN necesita estos permisos para publicar en Pages vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; si se empujan dos commits seguidos, gana el último.
# No se cancela el que está en vuelo para no dejar Pages a medio publicar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # No se publica un build que no pasa los tests.
      - name: Tests
        run: npm test

      # Pages es un project site y sirve bajo /Dashboard---CEI/, así que el
      # prefijo se declara aquí. Por defecto la base es '/', que es lo que
      # necesitan Vercel y cualquier dominio propio.
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /Dashboard---CEI/

      # GitHub Pages no reescribe rutas desconocidas hacia index.html, así que
      # al recargar /reales/sede devolvería 404. Sirviendo el mismo documento
      # como 404.html, Pages lo entrega y el router resuelve la ruta en cliente:
      # las URLs siguen siendo reales y enlazables, sin pasar a hash.
      - name: SPA fallback (404.html)
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
